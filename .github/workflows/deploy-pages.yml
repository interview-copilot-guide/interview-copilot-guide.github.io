name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build the pre-rendered site
        run: npm run export:github
        env:
          # Organisation root Page: https://<org>.github.io
          # For a project Page, point VITE_SITE_URL at the project URL and set
          # GITHUB_PAGES_BASE to /<repository-name>/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          GITHUB_PAGES_BASE: /
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
