<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6e4a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6e4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#caff47" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#caff47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#172520"/>
  <g transform="translate(0 285)">
  <rect width="1200" height="630" fill="#172520"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="520" cy="30" r="260" fill="url(#glow)"/>

  <!-- radar -->
  <g transform="translate(905 315)">
    <circle r="290" fill="url(#coreGlow)"/>
    <circle r="252" fill="none" stroke="#caff47" stroke-opacity="0.40" stroke-width="1.5"/>
    <circle r="171" fill="none" stroke="#caff47" stroke-opacity="0.40" stroke-width="1.5"/>
    <circle r="86" fill="none" stroke="#caff47" stroke-opacity="0.40" stroke-width="1.5"/>
    <line x1="-252" y1="0" x2="252" y2="0" stroke="#caff47" stroke-opacity="0.24" stroke-width="1.5"/>
    <line x1="0" y1="-252" x2="0" y2="252" stroke="#caff47" stroke-opacity="0.24" stroke-width="1.5"/>

    <circle cx="-96" cy="-156" r="9" fill="#ff6e4a" stroke="#172520" stroke-width="3"/>
    <circle cx="196" cy="-46" r="9" fill="#6da8ff" stroke="#172520" stroke-width="3"/>
    <circle cx="-56" cy="196" r="9" fill="#ff6e4a" stroke="#172520" stroke-width="3"/>
    <circle cx="-186" cy="-70" r="9" fill="#b9f4db" stroke="#172520" stroke-width="3"/>
    <circle cx="118" cy="128" r="9" fill="#caff47" stroke="#172520" stroke-width="3"/>

    <g font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">
      <rect x="-268" y="-14" width="98" height="28" fill="#f2f1e4"/>
      <text x="-219" y="6" text-anchor="middle" fill="#172520">DESKTOP</text>
      <rect x="176" y="-136" width="66" height="28" fill="#f2f1e4"/>
      <text x="209" y="-116" text-anchor="middle" fill="#172520">WEB</text>
      <rect x="-24" y="218" width="128" height="28" fill="#f2f1e4"/>
      <text x="40" y="238" text-anchor="middle" fill="#172520">TECHNICAL</text>
    </g>

    <circle r="76" fill="#caff47"/>
    <text x="0" y="6" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="62" fill="#172520">69</text>
    <text x="0" y="34" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#172520">PRODUCTS</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(72 78)">
    <circle cx="21" cy="0" r="21" fill="#caff47"/>
    <text x="21" y="7" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="19" fill="#172520">IC</text>
    <text x="56" y="6" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2.2" fill="#f2f1e4">INTERVIEW COPILOT <tspan fill="#caff47">/ GUIDE</tspan></text>
  </g>

  <!-- headline -->
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="104" letter-spacing="-4">
    <text x="70" y="248" fill="#f2f1e4">The interview</text>
    <text x="70" y="344" fill="#caff47" font-style="italic">copilot</text>
    <text x="70" y="440" fill="#f2f1e4">guide.</text>
  </g>

  <line x1="70" y1="500" x2="640" y2="500" stroke="#caff47" stroke-opacity="0.55" stroke-width="2"/>
  <text x="70" y="546" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.6" fill="#f2f1e4">69 PRODUCTS<tspan fill="#caff47"> · </tspan>PRICING<tspan fill="#caff47"> · </tspan>PLATFORMS<tspan fill="#caff47"> · </tspan>MODELS</text>
  <text x="70" y="580" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4" fill="#f2f1e4" fill-opacity="0.6">REAL-TIME AI INTERVIEW ASSISTANTS · 11 LANGUAGES · UPDATED 2026</text>
  </g>
</svg>
